<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<div class="container">

  <div class="card shadow-sm">
    <div class="card-body">
      <form  th:action="@{/drink/new}" th:object="${drink}" method="post">

        <div class="mb-3">
          <label class="form-label">Nazwa</label>
          <input type="text" class="form-control"
                 th:classappend="${#fields.hasErrors('name')} ? ' is-invalid'"
                 th:field="*{name}" required>
          <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Błąd</div>
        </div>

        <div class="mb-3">
          <label class="form-label">Opis</label>
          <textarea rows="3" class="form-control"
                    th:classappend="${#fields.hasErrors('description')} ? ' is-invalid'"
                    th:field="*{description}"></textarea>
          <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}"
               th:errors="*{description}">Błąd
          </div>
        </div>


        <div class="mt-4 d-flex gap-2">
          <button type="submit" class="btn btn-primary">Zapisz</button>
          <a th:href="@{/drink/list}" class="btn btn-outline-secondary">Anuluj</a>
        </div>
      </form>
    </div>
  </div>
</div>

</body>
</html>
